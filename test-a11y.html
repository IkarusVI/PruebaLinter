<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A11y Test Lab</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="container">
        <h1>Welcome to the Lab</h1>

        <h3>Experimental Feature</h3>

        <div class="card">

            <img src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=400&q=80" width="100%"
                alt="A beautiful landscape image">


            <p>This is a test card for our linter. It looks great but has several issues.</p>


            <button class="btn" id="submit-btn" id="submit-btn">
                <svg width="20" height="20" fill="currentColor" viewBox="0 0 20 20">
                    <path
                        d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z">
                    </path>
                </svg>
            </button>
        </div>

        <div class="card">
            <h3>Configuration</h3>

            <input type="text" placeholder="Enter your secret key...">


            <div class="fake-button" onclick="alert('Saving...')">Save Changes</div>
        </div>

        <div class="card">
            <h3>Compliance Status</h3>

            <p class="low-contrast">This text is very hard to read because the contrast ratio is too low.</p>
        </div>


        <div id="duplicate-warning">Warning 1</div>
        <div id="duplicate-warning">Warning 2</div>

        <div style="margin-top: 2rem;">

            <a href="#" class="btn" style="background: #ef4444;">Click Here</a>
        </div>
    </div>
</body>

</html>
